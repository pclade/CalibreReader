name: Android build

on:
  push:
    branches: [main, codex/cloud-support-baseline]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          sdkmanager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([sdkmanager, '--licenses'], input='y\n' * 100, text=True, check=True, stdout=subprocess.DEVNULL)
          subprocess.run([sdkmanager, 'platforms;android-36', 'build-tools;36.0.0'], input='y\n' * 100, text=True, check=True)
          PY
      - name: Build, unit tests and Android Lint
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify configured Dropbox redirect
        run: |
          ./gradlew --no-daemon --console=plain :app:processDebugMainManifest -PDROPBOX_APP_KEY=publicfixture
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('app/build/intermediates').glob('**/processDebugMainManifest/AndroidManifest.xml'))
          assert paths, 'Merged manifest not found'
          root = ET.parse(paths[0]).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          activity = next(x for x in root.findall('./application/activity') if x.get(android + 'name') == 'com.dropbox.core.android.AuthActivity')
          assert activity.get(android + 'enabled') == 'true'
          assert activity.get(android + 'launchMode') == 'singleTask'
          assert any(x.get(android + 'scheme') == 'db-publicfixture' for x in activity.findall('./intent-filter/data'))
          print('Dropbox redirect and enabled state verified')
          PY
      - name: Summarize verification
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import collections, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          counts = {key: sum(int(s.get(key, '0')) for s in suites) for key in ['tests', 'failures', 'errors', 'skipped']}
          print('Unit test results:', counts)
          for suite in suites:
              for test in suite.findall('testcase'):
                  for failure in test.findall('failure'):
                      print(test.get('name'), failure.get('message'), failure.text)
          lint = Path('app/build/reports/lint-results-debug.xml')
          if lint.exists():
              report = ET.parse(lint).getroot()
              print('Lint results:', dict(collections.Counter(x.get('severity') for x in report.findall('issue'))))
          PY
